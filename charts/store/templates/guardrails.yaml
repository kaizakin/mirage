apiVersion: v1
kind: ResourceQuota
metadata:
  name: store
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    {{- toYaml .Values.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: store
  namespace: {{ .Release.Namespace }}
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.limits.default | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.limits.defaultRequest | nindent 8 }}
      max:
        {{- toYaml .Values.limits.max | nindent 8 }}
    - type: PersistentVolumeClaim
      max:
        storage: {{ .Values.limits.maxStorage }}
