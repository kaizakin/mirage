wordpress:
  replicaCount: 1
  image:
    repository: wordpress
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: traefik
    host: shop.127.0.0.1.nip.io
    # HTTPS through cert-manager: clusterIssuer signs a certificate for the host.
    tls:
      enabled: false
      clusterIssuer: ""
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# post-install/post-upgrade Job that installs WordPress + WooCommerce and
# publishes an application password to the woo-api-credentials Secret
setup:
  # true runs setup as a Helm hook after every install and upgrade, which then waits for it.
  # false makes it an ordinary Job created with everything else, for a provisioner that
  # installs without waiting and watches the Job finish.
  hook: true
  # Public URL WordPress builds links from; override per environment
  siteUrl: http://shop.127.0.0.1.nip.io
  # ISO 4217 code the store prices in; the catalog's prices (files/catalog/catalog.tsv) are rupees.
  currency: INR
  title: Mirage Tea House
  tagline: Loose-leaf tea and teaware, brewed in small batches
  # A wordpress.org theme slug, installed and activated on every run. Extendable is a block
  # theme with WooCommerce templates and style variations.
  theme: extendable
  # One of the theme's style variations (a file in its styles/ directory), or "" for its default.
  themeStyle: butterscotch
  # Created on a fresh install; on an already-installed site it must name an existing administrator
  adminUser: admin
  adminPassword: "password"
  wpCliImage: wordpress:cli-2.12.0
  kubectlImage: alpine/kubectl:1.36.4
  credentialsSecret: woo-api-credentials

mysql:
  # false points WordPress at externalDatabase instead of running MySQL in the release
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  # Extra mysqld flags, such as --innodb-buffer-pool-size=64M on a small node.
  args: []
  database: app_db
  user: app_user
  password: "password"
  rootPassword: "password"
  persistence:
    storageClass: ""
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

externalDatabase:
  host: ""
  port: 3306
  database: app_db
  user: app_user
  existingSecret: ""
