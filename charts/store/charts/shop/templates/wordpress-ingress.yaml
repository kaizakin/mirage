{{- if .Values.wordpress.ingress.enabled }}
{{- $host := .Values.wordpress.ingress.host | default "shop.127.0.0.1.nip.io" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wordpress.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
  {{- if .Values.wordpress.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.wordpress.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  {{- if .Values.wordpress.ingress.className }}
  ingressClassName: {{ .Values.wordpress.ingress.className }}
  {{- end }}
  {{- if .Values.wordpress.ingress.tls.enabled }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ include "wordpress.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "wordpress.fullname" . }}
                port:
                  number: {{ .Values.wordpress.service.port | default 80 }}
{{- end }}
