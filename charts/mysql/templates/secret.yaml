{{- $secretName := include "mysql.fullname" . -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "mysql-root-password") }}
  mysql-root-password: {{ index $existingSecret.data "mysql-root-password" }}
  {{- else }}
  mysql-root-password: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
  {{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "mysql-password") }}
  mysql-password: {{ index $existingSecret.data "mysql-password" }}
  {{- else }}
  mysql-password: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
