{{- $dbName := ternary .Values.mysql.mysql.database .Values.externalDatabase.database .Values.mysql.enabled -}}
{{- $dbUser := ternary .Values.mysql.mysql.user .Values.externalDatabase.user .Values.mysql.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wordpress.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "wordpress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wordpress.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              DB_HOST="${WORDPRESS_DB_HOST:-mysql}"
              DB_PORT="3306"
              if [ "${DB_HOST#*:}" != "$DB_HOST" ]; then
                DB_PORT="${DB_HOST#*:}"
                DB_HOST="${DB_HOST%:*}"
              fi
              echo "Waiting for MySQL at $DB_HOST:$DB_PORT..."
              until nc -z -w 2 "$DB_HOST" "$DB_PORT"; do
                echo "MySQL not ready yet. Retrying in 2 seconds..."
                sleep 2
              done
              echo "MySQL is reachable and accepting connections!"
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ include "wordpress.mysql.host" . }}:3306"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: wordpress
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ include "wordpress.mysql.host" . }}:3306"
            - name: WORDPRESS_DB_NAME
              value: {{ $dbName | default "app_db" | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ $dbUser | default "app_user" | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wordpress.mysql.secretName" . }}
                  key: mysql-password
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | default "200m" | quote }}
              memory: {{ .Values.resources.requests.memory | default "256Mi" | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | default "1000m" | quote }}
              memory: {{ .Values.resources.limits.memory | default "512Mi" | quote }}
          startupProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/www/html
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "wordpress.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
