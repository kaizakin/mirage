{{- /* Setup works on the WordPress files, so it needs the volume shared with the Deployment */ -}}
{{- if .Values.persistence.enabled }}
{{- $fullname := include "wordpress.fullname" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}-setup
      automountServiceAccountToken: false
      # wp-cli's image uses musl, which gives up on external names (downloads.wordpress.org) when a node-inherited
      # search domain errors under the default ndots:5; in-cluster short names like the DB host still resolve
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      securityContext:
        # www-data in the Debian-based wordpress image, which owns wp-content (wp-cli's alpine image uses 82)
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
      affinity:
        # The PVC is ReadWriteOnce: it can only be attached on the node already running WordPress
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "wordpress.selectorLabels" . | nindent 18 }}
      initContainers:
        - name: wp-setup
          image: {{ .Values.setup.wpCliImage }}
          env:
            {{- include "wordpress.dbEnv" . | nindent 12 }}
            - name: SITE_URL
              value: {{ .Values.setup.siteUrl | quote }}
            - name: ADMIN_USER
              value: {{ .Values.setup.adminUser | quote }}
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-admin
                  key: admin-password
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -ec
            - |
              until [ -f wp-config.php ]; do echo "waiting for the WordPress pod to populate the volume"; sleep 3; done
              # mysqli rather than `wp db`: the image's MariaDB client can't auth against MySQL 8's caching_sha2_password
              until php -r 'mysqli_report(MYSQLI_REPORT_OFF); [$h, $p] = array_pad(explode(":", getenv("WORDPRESS_DB_HOST")), 2, 3306);
                exit(@mysqli_connect($h, getenv("WORDPRESS_DB_USER"), getenv("WORDPRESS_DB_PASSWORD"), getenv("WORDPRESS_DB_NAME"), (int) $p) ? 0 : 1);'; do
                echo "waiting for the database"; sleep 3
              done

              if ! wp core is-installed; then
                wp core install --url="$SITE_URL" --title=Shop --admin_user="$ADMIN_USER" \
                  --admin_password="$ADMIN_PASS" --admin_email=admin@example.com --skip-email
              fi
              # A site installed before this hook existed keeps its own administrators; don't invent one
              if ! wp user get "$ADMIN_USER" --field=ID >/dev/null 2>&1; then
                echo "WordPress has no user '$ADMIN_USER'; set setup.adminUser to an existing administrator" >&2
                exit 1
              fi
              # install only sets the URL once; keep it in sync with values on every upgrade
              wp option update home "$SITE_URL"
              wp option update siteurl "$SITE_URL"

              wp plugin is-installed woocommerce || wp plugin install woocommerce
              wp plugin is-active woocommerce || wp plugin activate woocommerce
              wp rewrite structure '/%postname%/'
              wp option update show_on_front page
              wp option update page_on_front "$(wp option get woocommerce_shop_page_id)"
              wp wc payment_gateway update cod --enabled=true --user="$ADMIN_USER"
              if [ -z "$(wp post list --post_type=product --name=seed-mug --post_status=any --format=ids)" ]; then
                wp wc product create --name="Seed Mug" --slug=seed-mug --regular_price=299 --user="$ADMIN_USER"
              fi

              if [ -s /existing/password ]; then
                echo "{{ .Values.setup.credentialsSecret }} already exists; leaving the application password alone"
                exit 0
              fi
              # The plaintext of any earlier "mcp" password is lost (a previous run died before saving it), so revoke it;
              # WordPress also rejects a duplicate name
              for uuid in $(wp user application-password list "$ADMIN_USER" --name=mcp --field=uuid); do
                wp user application-password delete "$ADMIN_USER" "$uuid"
              done
              wp user application-password create "$ADMIN_USER" mcp --porcelain > /shared/pass
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            - name: mu-plugins
              mountPath: /var/www/html/wp-content/mu-plugins
              readOnly: true
            - name: shared
              mountPath: /shared
            - name: existing-credentials
              mountPath: /existing
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      containers:
        - name: publish-credentials
          image: {{ .Values.setup.kubectlImage }}
          env:
            - name: SITE_URL
              value: {{ .Values.setup.siteUrl | quote }}
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -s /shared/pass ]; then
                echo "no new application password; nothing to publish"
                exit 0
              fi
              kubectl create secret generic {{ .Values.setup.credentialsSecret }} \
                --from-literal=url="$SITE_URL" \
                --from-literal=username={{ .Values.setup.adminUser | quote }} \
                --from-file=password=/shared/pass \
                --dry-run=client -o yaml | kubectl apply -f -
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
            # Only this container gets the API token; the wp-cli container runs third-party plugin code
            - name: api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullname }}
        - name: mu-plugins
          configMap:
            name: {{ $fullname }}-mu-plugins
        - name: shared
          emptyDir:
            medium: Memory
        - name: existing-credentials
          secret:
            secretName: {{ .Values.setup.credentialsSecret }}
            optional: true
        - name: api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
{{- end }}
