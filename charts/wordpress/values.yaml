replicaCount: 1

image:
  repository: wordpress
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  host: shop.127.0.0.1.nip.io

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

# post-install/post-upgrade Job that installs WordPress + WooCommerce and
# publishes an application password to the woo-api-credentials Secret
setup:
  # Public URL WordPress builds links from; override per environment
  siteUrl: http://shop.127.0.0.1.nip.io
  wpCliImage: wordpress:cli-2.12.0
  kubectlImage: alpine/kubectl:1.36.4
  credentialsSecret: woo-api-credentials

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Subchart values for MySQL (umbrella dependency)
mysql:
  enabled: true
  replicaCount: 1
  mysql:
    database: "app_db"
    user: "app_user"
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

externalDatabase:
  host: ""
  port: 3306
  database: "app_db"
  user: "app_user"
  existingSecret: ""
