apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  {{- /* A Secret per Ingress: cert-manager names the Certificate after it, and two Ingresses
  naming the same Secret would contend for one Certificate. */}}
  tls:
    - hosts: {{ list .Values.ingress.host .Values.ingress.dashboardHost | uniq | toJson }}
      secretName: {{ include "gateway.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- /* The MCP endpoint, and the OAuth discovery documents and endpoints clients use to sign in. */}}
          {{- range list "/mcp" "/oauth" "/.well-known/oauth-protected-resource" "/.well-known/oauth-authorization-server" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "gateway.fullname" $ }}
                port:
                  name: http
          {{- end }}
    # The dashboard calls /api on its own origin, so its session cookie stays first-party.
    - host: {{ .Values.ingress.dashboardHost }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "gateway.fullname" . }}
                port:
                  name: http
