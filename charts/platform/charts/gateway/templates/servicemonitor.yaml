{{- /* Only where the Prometheus operator is installed (make monitoring); elsewhere the CRD is missing. */ -}}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  endpoints:
    # Every replica is scraped on its own, through the Service's endpoints.
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
