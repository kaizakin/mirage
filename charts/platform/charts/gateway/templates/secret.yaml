{{- $name := include "gateway.fullname" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- /* A gw_<id>_<secret> key: randAlpha keeps the id inside the key's base32 alphabet, and the
       secret is 32 random bytes as unpadded base64url, the only spelling the gateway accepts. */ -}}
{{- $generatedKey := printf "gw_%s_%s" (randAlpha 8 | lower) (randBytes 32 | replace "+" "-" | replace "/" "_" | trimSuffix "=") -}}
{{- $values := dict
      "secretbox-key" (list .Values.secretboxKey (randBytes 32))
      "admin-password" (list .Values.admin.password (randAlphaNum 24))
      "admin-api-key" (list .Values.admin.apiKey $generatedKey) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $v := $values }}
  {{- $override := index $v 0 }}
  {{- if $override }}
  {{ $key }}: {{ $override | b64enc | quote }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key | quote }}
  {{- else }}
  {{ $key }}: {{ index $v 1 | b64enc | quote }}
  {{- end }}
  {{- end }}
