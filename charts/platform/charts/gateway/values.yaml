image:
  repository: mirage/gateway
  tag: dev
  pullPolicy: IfNotPresent
# Image ID of the locally built image (make images sets it); a new value rolls the pod
# even though the tag stays the same.
imageId: ""

ingress:
  className: traefik
  host: gateway.127.0.0.1.nip.io
  # The dashboard's host; its /api path routes here.
  dashboardHost: dash.127.0.0.1.nip.io
  # HTTPS through cert-manager: clusterIssuer signs a certificate for both hosts.
  tls:
    enabled: false
    clusterIssuer: ""

# The chat agent's model provider: groq or gemini. Each reads its key from a Secret you
# create; without the chosen provider's key, chat answers 503.
#   kubectl -n <ns> create secret generic <release>-groq --from-literal=api-key=...
#   kubectl -n <ns> create secret generic <release>-gemini --from-literal=api-key=...
llm:
  provider: groq
groq:
  # Groq's free tier allowed 1,000 requests a day on this model (2026-10), against
  # Gemini's 20, and it chains tool calls reliably.
  model: openai/gpt-oss-120b
gemini:
  # Measured on the free tier (2026-10-25): gemini-3.5-flash answered tool calls in ~2.5s;
  # gemini-3.8-flash took ~60s or returned 503 "high demand".
  model: gemini-3.5-flash

# Provisioned stores: each is served at <scheme>://<slug>.<domain>, and a user may have at
# most maxPerUser at once. The scheme must match provisioner.stores.scheme.
stores:
  domain: shop.127.0.0.1.nip.io
  scheme: http
  maxPerUser: 3

# How clients reach the gateway and dashboard hosts. It forms the OAuth issuer and the
# dashboard's consent page URL; a plain-HTTP local cluster sets http.
scheme: https

# Replicas behind the one /mcp endpoint; MCP sessions follow their replica (package affinity).
replicaCount: 2

# Tool calls each user may make per minute, across all replicas and credentials; 0 for none.
rateLimitPerMinute: 120

# Where Prometheus runs (make monitoring); only it may scrape /metrics, which the ingress
# does not route.
metrics:
  prometheusNamespace: monitoring

# Mark the dashboard session cookie Secure. Only a plain-HTTP local cluster turns this off.
secureCookies: true

# Base64 of 32 random bytes; seals upstream credentials. Empty keeps the existing one or
# generates one. Losing it makes stored credentials unreadable.
secretboxKey: ""

# The first admin, created on first start. Empty password or apiKey keeps the existing one
# or generates one; read them back from the <release>-gateway Secret. The admin's password
# follows this Secret: change it and the next gateway start signs the admin in with the new one.
admin:
  email: admin@mirage.local
  password: ""
  apiKey: ""

database:
  name: mirage
  user: mirage

# Upstreams created on first start; later edits in the database win. url and
# credentialSecret.name are templated, so they can follow the release name.
upstreams:
  - slug: currency
    url: "http://{{ .Release.Name }}-currency-mcp:8080/mcp"
    authType: header
    authHeader: X-Api-Key
    credentialSecret:
      name: "{{ .Release.Name }}-currency-mcp"
      key: apiKey
  - slug: deepwiki
    url: https://mcp.deepwiki.com/mcp
    authType: none

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
