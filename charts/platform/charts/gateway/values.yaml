image:
  repository: mirage/gateway
  tag: dev
  pullPolicy: IfNotPresent
# Image ID of the locally built image (make images sets it); a new value rolls the pod
# even though the tag stays the same.
imageId: ""

ingress:
  className: traefik
  host: gateway.127.0.0.1.nip.io
  # The dashboard's host; its /api path routes here.
  dashboardHost: dash.127.0.0.1.nip.io

# The chat agent's model. The key comes from a Secret you create (optional: without it,
# chat answers 503):
#   kubectl -n <ns> create secret generic <release>-gemini --from-literal=api-key=...
gemini:
  # Measured on the free tier (2026-10-25): gemini-3.5-flash answered tool calls in ~2.5s;
  # gemini-3.8-flash took ~60s or returned 503 "high demand".
  model: gemini-3.5-flash

# Mark the dashboard session cookie Secure. Only a plain-HTTP local cluster turns this off.
secureCookies: true

# Base64 of 32 random bytes; seals upstream credentials. Empty keeps the existing one or
# generates one. Losing it makes stored credentials unreadable.
secretboxKey: ""

# The first admin, created on first start. Empty password or apiKey keeps the existing one
# or generates one; read them back from the <release>-gateway Secret.
admin:
  email: admin@mirage.local
  password: ""
  apiKey: ""

database:
  name: mirage
  user: mirage

# Upstreams created on first start; later edits in the database win. url and
# credentialSecret.name are templated, so they can follow the release name.
upstreams:
  - slug: woo
    url: "http://{{ .Release.Name }}-woo-mcp:8080/mcp"
    authType: bearer
    credentialSecret:
      name: "{{ .Release.Name }}-woo-mcp"
      key: token
  - slug: currency
    url: "http://{{ .Release.Name }}-currency-mcp:8080/mcp"
    authType: header
    authHeader: X-Api-Key
    credentialSecret:
      name: "{{ .Release.Name }}-currency-mcp"
      key: apiKey
  - slug: deepwiki
    url: https://mcp.deepwiki.com/mcp
    authType: none

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
