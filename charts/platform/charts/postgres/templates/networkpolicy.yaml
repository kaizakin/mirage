apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "postgres.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  # The gateway is the only client; its chart labels its pods app: gateway.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: postgres
          protocol: TCP
