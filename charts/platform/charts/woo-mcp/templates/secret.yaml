{{- $secretName := include "woo-mcp.fullname" . -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "woo-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.bearerToken }}
  token: {{ .Values.bearerToken | b64enc | quote }}
  {{- else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "token") }}
  token: {{ index $existingSecret.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
