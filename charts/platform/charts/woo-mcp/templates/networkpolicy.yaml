apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "woo-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "woo-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "woo-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - port: http
          protocol: TCP
