image:
  repository: mirage/provisioner
  tag: dev
  pullPolicy: IfNotPresent
# Image ID of the locally built image (make images sets it); a new value rolls the pod.
imageId: ""

# How long a store may take to become ready before it fails with the reason.
timeout: 10m

stores:
  # Scheme of the stores' public URLs; https needs TLS on their ingresses (values below).
  # It must match gateway.stores.scheme.
  scheme: http
  # Values of the store chart (charts/store) every new store is installed with, beneath the
  # ones the provisioner sets per store: TLS, images, a resource profile. Stores that exist
  # keep theirs until deploy/upgrade-stores.sh upgrades them.
  values: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
