apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "currency-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "currency-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "currency-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  # Only the gateway may call this server; the gateway chart labels its pods app: gateway.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: http
          protocol: TCP
