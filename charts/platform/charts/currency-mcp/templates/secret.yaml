{{- $secretName := include "currency-mcp.fullname" . -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "currency-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.apiKey }}
  apiKey: {{ .Values.apiKey | b64enc | quote }}
  {{- else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "apiKey") }}
  apiKey: {{ index $existingSecret.data "apiKey" }}
  {{- else }}
  apiKey: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
