{{- /* Setup works on the WordPress files, so it needs the volume shared with the Deployment */ -}}
{{- if .Values.wordpress.persistence.enabled }}
{{- $fullname := include "wordpress.fullname" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}-setup
      automountServiceAccountToken: false
      # wp-cli's image uses musl, which gives up on external names (downloads.wordpress.org) when a node-inherited
      # search domain errors under the default ndots:5; in-cluster short names like the DB host still resolve
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      securityContext:
        # www-data in the Debian-based wordpress image, which owns wp-content (wp-cli's alpine image uses 82)
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
      affinity:
        # The PVC is ReadWriteOnce: it can only be attached on the node already running WordPress
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "wordpress.selectorLabels" . | nindent 18 }}
      initContainers:
        - name: wp-setup
          image: {{ .Values.setup.wpCliImage }}
          env:
            {{- include "wordpress.dbEnv" . | nindent 12 }}
            - name: SITE_URL
              value: {{ .Values.setup.siteUrl | quote }}
            - name: ADMIN_USER
              value: {{ .Values.setup.adminUser | quote }}
            - name: CREDENTIALS_SECRET
              value: {{ .Values.setup.credentialsSecret | quote }}
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-admin
                  key: admin-password
            - name: HOME
              value: /tmp
          command: ["/bin/sh", "/scripts/wp-setup.sh"]
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            - name: mu-plugins
              mountPath: /var/www/html/wp-content/mu-plugins
              readOnly: true
            - name: shared
              mountPath: /shared
            - name: existing-credentials
              mountPath: /existing
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      containers:
        - name: publish-credentials
          image: {{ .Values.setup.kubectlImage }}
          env:
            - name: SITE_URL
              value: {{ .Values.setup.siteUrl | quote }}
            - name: ADMIN_USER
              value: {{ .Values.setup.adminUser | quote }}
            - name: CREDENTIALS_SECRET
              value: {{ .Values.setup.credentialsSecret | quote }}
            - name: HOME
              value: /tmp
          command: ["/bin/sh", "/scripts/publish-credentials.sh"]
          volumeMounts:
            - name: shared
              mountPath: /shared
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            # Only this container gets the API token; the wp-cli container runs third-party plugin code
            - name: api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullname }}
        - name: mu-plugins
          configMap:
            name: {{ $fullname }}-mu-plugins
        - name: shared
          emptyDir:
            medium: Memory
        - name: scripts
          configMap:
            name: {{ $fullname }}-setup-scripts
        - name: existing-credentials
          secret:
            secretName: {{ .Values.setup.credentialsSecret }}
            optional: true
        - name: api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
{{- end }}
