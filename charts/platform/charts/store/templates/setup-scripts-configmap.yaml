{{- if .Values.wordpress.persistence.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wordpress.fullname" . }}-setup-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/*.sh").AsConfig | nindent 2 }}
{{- end }}
